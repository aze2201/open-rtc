
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRTC - Screen Sharing</title>

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            font-size: 26px;
        }

        button {
            padding: 14px 24px;
            border: 0;
            border-radius: 8px;
            background: #087bdf;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #status {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .qr-section {
            margin: 25px 0;
            padding: 18px;
            background: white;
            border-radius: 10px;
        }

        .qr {
            display: flex;
            justify-content: center;
            margin: 15px auto;
        }

        .qr canvas,
        .qr img {
            max-width: 100%;
            height: auto;
        }

        .controls {
            margin: 25px 0;
            padding: 18px;
            background: white;
            border-radius: 10px;
            text-align: left;
        }

        .control {
            margin: 18px 0;
        }

        .control label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
        }

        a {
            overflow-wrap: anywhere;
        }

        .muted {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <h1>OpenRTC Screen Sharing</h1>

    <p>Start screen sharing, then scan the QR code with your mobile device.</p>

    <button id="startButton">Start Sharing Display</button>

    <div id="status">Initializing PeerJS...</div>

    <section class="qr-section">
        <h2>AR Mode</h2>
        <div id="qrAR" class="qr"></div>
        <a id="linkAR" href="#" target="_blank">AR link</a>
    </section>

    <section class="qr-section">
        <h2>VR Mode</h2>
        <div id="qrVR" class="qr"></div>
        <a id="linkVR" href="#" target="_blank">VR link</a>
    </section>

    <section class="controls">
        <h2>Display Settings</h2>

        <div class="control">
            <label for="widthInput">
                <span>Width</span>
                <strong id="widthValue">200</strong>
            </label>
            <input type="range" id="widthInput"
                   min="100" max="500" value="200">
        </div>

        <div class="control">
            <label for="heightInput">
                <span>Height</span>
                <strong id="heightValue">200</strong>
            </label>
            <input type="range" id="heightInput"
                   min="100" max="500" value="200">
        </div>

        <div class="control">
            <label for="distanceInput">
                <span>Distance</span>
                <strong id="distanceValue">200</strong>
            </label>
            <input type="range" id="distanceInput"
                   min="100" max="500" value="200">
        </div>

        <p class="muted">
            These settings are sent to connected mobile clients.
        </p>
    </section>

<script>
"use strict";

const startButton = document.getElementById("startButton");
const statusElement = document.getElementById("status");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const distanceInput = document.getElementById("distanceInput");

let peer = null;
let screenStream = null;

const pendingCalls = [];
const dataConnections = new Set();

function setStatus(message) {
    statusElement.textContent = message;
}

function getSettings() {
    return {
        width: Number(widthInput.value),
        height: Number(heightInput.value),
        distance: Number(distanceInput.value)
    };
}

function sendSettings(connection) {
    if (!connection || !connection.open) {
        return;
    }

    const settings = getSettings();

    connection.send(
        `${settings.width},${settings.height},${settings.distance}`
    );
}

function broadcastSettings() {
    for (const connection of dataConnections) {
        sendSettings(connection);
    }
}

function updateSettingLabels() {
    document.getElementById("widthValue").textContent =
        widthInput.value;

    document.getElementById("heightValue").textContent =
        heightInput.value;

    document.getElementById("distanceValue").textContent =
        distanceInput.value;

    broadcastSettings();
}

function answerCall(call) {
    if (!screenStream) {
        pendingCalls.push(call);
        return;
    }

    console.log("Answering incoming media call.");

    try {
        call.answer(screenStream);

        call.on("error", error => {
            console.error("Media call error:", error);
        });

        call.on("close", () => {
            console.log("Mobile media connection closed.");
        });
    } catch (error) {
        console.error("Could not answer media call:", error);
    }
}

function answerPendingCalls() {
    while (pendingCalls.length > 0 && screenStream) {
        const call = pendingCalls.shift();
        answerCall(call);
    }
}

function createMobileLinks(peerId) {
    // Resolve URLs relative to this page.
    // Works with GitHub Pages subdirectories.

    const arUrl = new URL("share-screen.html", window.location.href);
    arUrl.searchParams.set("PeerDesktopID", peerId);

    const vrUrl = new URL("viar.html", window.location.href);
    vrUrl.searchParams.set("PeerDesktopID", peerId);

    document.getElementById("linkAR").href = arUrl.href;
    document.getElementById("linkAR").textContent = arUrl.href;

    document.getElementById("linkVR").href = vrUrl.href;
    document.getElementById("linkVR").textContent = vrUrl.href;

    document.getElementById("qrAR").innerHTML = "";
    document.getElementById("qrVR").innerHTML = "";

    new QRCode(document.getElementById("qrAR"), {
        text: arUrl.href,
        width: 220,
        height: 220
    });

    new QRCode(document.getElementById("qrVR"), {
        text: vrUrl.href,
        width: 220,
        height: 220
    });

    console.log("AR URL:", arUrl.href);
    console.log("VR URL:", vrUrl.href);
}

async function startScreenSharing() {
    if (screenStream) {
        return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {
        setStatus("Screen sharing is not supported by this browser.");
        return;
    }

    try {
        // Desktop screen capture only.
        // No camera or microphone is requested here.
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false
        });

        startButton.disabled = true;
        startButton.textContent = "Sharing Display";

        setStatus("Screen sharing active. Waiting for mobile connection...");

        const videoTrack = screenStream.getVideoTracks()[0];

        if (videoTrack) {
            videoTrack.addEventListener("ended", () => {
                screenStream = null;
                startButton.disabled = false;
                startButton.textContent = "Start Sharing Display";
                setStatus("Screen sharing stopped.");
            });
        }

        answerPendingCalls();

    } catch (error) {
        console.error("Screen sharing error:", error);
        setStatus("Could not start screen sharing: " + error.message);
    }
}

// Initialize PeerJS once.
peer = new Peer(undefined, {
    debug: 1
});

peer.on("open", peerId => {
    console.log("Desktop Peer ID:", peerId);

    createMobileLinks(peerId);

    setStatus("Ready. Start screen sharing and scan the VR QR code.");
});

// Register the call handler immediately.
// This avoids missing calls while the user is starting screen sharing.
peer.on("call", incomingCall => {
    console.log("Incoming media call:", incomingCall.peer);
    answerCall(incomingCall);
});

// Data channel for display settings.
peer.on("connection", connection => {
    console.log("Mobile data connection:", connection.peer);

    dataConnections.add(connection);

    connection.on("open", () => {
        console.log("Mobile settings channel connected.");
        sendSettings(connection);
    });

    connection.on("data", data => {
        console.log("Mobile message:", data);
        sendSettings(connection);
    });

    connection.on("close", () => {
        dataConnections.delete(connection);
    });

    connection.on("error", error => {
        console.error("Data connection error:", error);
        dataConnections.delete(connection);
    });
});

peer.on("disconnected", () => {
    setStatus("Disconnected from PeerJS server.");
});

peer.on("error", error => {
    console.error("PeerJS error:", error);
    setStatus("PeerJS error: " + error.type);
});

startButton.addEventListener("click", startScreenSharing);

widthInput.addEventListener("input", updateSettingLabels);
heightInput.addEventListener("input", updateSettingLabels);
distanceInput.addEventListener("input", updateSettingLabels);

updateSettingLabels();

</script>

</body>
</html>
