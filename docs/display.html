
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Sharing Sender</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 12px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 24px;
            margin-top: 10px;
        }

        video {
            max-width: 100%;
            width: 100%;
            height: auto;
            margin-top: 10px;
        }

        #startButton {
            margin-top: 15px;
            padding: 20px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #startButton:disabled {
            opacity: 0.6;
        }

        #qrcode, #qrcodeV {
            margin-top: 20px;
        }

        #changeable-element {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            transition: all 0.3s ease;
        }

        .size-controls {
            display: flex;
            align-items: center;
            width: min(95%, 500px);
            margin-bottom: 10px;
            gap: 10px;
        }

        .size-controls label {
            min-width: 75px;
        }

        .size-controls input {
            flex: 1;
            min-width: 0;
        }

        #status {
            margin: 12px;
            text-align: center;
        }
    </style>

    <!-- Keep PeerJS compatible with the original AR clients -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <!-- QRCode library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <h1>Screen Sharing Sender</h1>

    <center>
        <h2>
            This is your display ID.<br>
            Scan this QR code with your camera and connect to this display.
        </h2>
    </center>

    <button id="startButton">Start Sharing Display</button>

    <div id="status">Connecting to PeerJS...</div>

    <div id="qrcode"></div>

    <br>

    <center>
        <h2>
            Adjust your Augmented Object<br>
            This size will affect your mobile browser interface.
        </h2>
    </center>

    <div id="changeable-element"></div>

    <div class="size-controls">
        <label for="widthInput">Width:</label>
        <input type="range" id="widthInput"
               min="100" max="500" value="200" step="1">
    </div>

    <div class="size-controls">
        <label for="heightInput">Height:</label>
        <input type="range" id="heightInput"
               min="100" max="500" value="200" step="1">
    </div>

    <div class="size-controls">
        <label for="distanceInput">Distance:</label>
        <input type="range" id="distanceInput"
               min="100" max="500" value="200" step="1">
    </div>

    <center>
        <h2><br>Scan this QR for mobile VR mode</h2>
    </center>

    <div id="qrcodeV"></div>

    <center id="myCenter">
        <h2>Link to VR mode</h2>
    </center>

    <video id="localVideo" autoplay muted playsinline></video>

<script>
"use strict";

const startButton = document.getElementById("startButton");
const statusElement = document.getElementById("status");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const distanceInput = document.getElementById("distanceInput");

let peer = null;
let localStream = null;
let peerReady = false;

const connections = new Set();
const pendingCalls = [];

/*
 * Original settings protocol:
 * widthProgress, heightProgress, distanceProgress
 *
 * Example: 2,2,4
 */
function getSettings() {
    const width = Number(widthInput.value);
    const height = Number(heightInput.value);
    const distance = Number(distanceInput.value);

    return {
        width: width / 100,
        height: height / 100,
        distance: (distance / 100) * 2
    };
}

function sendSettings(connection) {
    if (!connection || !connection.open) return;

    const settings = getSettings();

    const message =
        settings.width + "," +
        settings.height + "," +
        settings.distance;

    connection.send(message);
}

function broadcastSettings() {
    for (const connection of connections) {
        sendSettings(connection);
    }
}

/* Original display preview and slider behavior */
function changeSize() {
    const width = Number(widthInput.value);
    const height = Number(heightInput.value);

    const element = document.getElementById("changeable-element");

    element.style.width = width + "px";
    element.style.height = height + "px";

    broadcastSettings();
}

widthInput.addEventListener("input", changeSize);
heightInput.addEventListener("input", changeSize);
distanceInput.addEventListener("input", changeSize);

/* Generate the original AR and VR QR codes */
function generateQRCodes(peerId) {
    const base = "https://aze2201.github.io/open-rtc/";

    const arUrl = base + "share-screen.html?PeerDesktopID=" +
        encodeURIComponent(peerId);

    const vrUrl = base + "viar.html?PeerDesktopID=" +
        encodeURIComponent(peerId);

    const qrAR = document.getElementById("qrcode");
    const qrVR = document.getElementById("qrcodeV");

    qrAR.innerHTML = "";
    qrVR.innerHTML = "";

    new QRCode(qrAR, {
        text: arUrl,
        width: 256,
        height: 256
    });

    new QRCode(qrVR, {
        text: vrUrl,
        width: 256,
        height: 256
    });

    const center = document.getElementById("myCenter");

    const oldLink = document.getElementById("vrLink");
    if (oldLink) oldLink.remove();

    const link = document.createElement("a");
    link.id = "vrLink";
    link.href = vrUrl;
    link.textContent = "Open VR mode";
    center.appendChild(link);

    console.log("Desktop Peer ID:", peerId);
    console.log("AR URL:", arUrl);
    console.log("VR URL:", vrUrl);
}

/* Answer mobile media calls */
function answerCall(call) {
    if (!localStream) {
        pendingCalls.push(call);
        return;
    }

    console.log("Answering media call:", call.peer);

    call.answer(localStream);

    call.on("error", error => {
        console.error("Media call error:", error);
    });

    call.on("close", () => {
        console.log("Media call closed:", call.peer);
    });
}

function answerPendingCalls() {
    while (pendingCalls.length > 0 && localStream) {
        answerCall(pendingCalls.shift());
    }
}

/* Handle mobile data connections */
function handleConnection(connection) {
    console.log("Mobile connected:", connection.peer);

    connections.add(connection);

    connection.on("open", () => {
        console.log("Settings connection opened.");
        sendSettings(connection);
    });

    connection.on("data", data => {
        console.log("Mobile message:", data);
        sendSettings(connection);
    });

    connection.on("close", () => {
        connections.delete(connection);
    });

    connection.on("error", error => {
        console.error("Data connection error:", error);
        connections.delete(connection);
    });
}

/* Initialize PeerJS */
function initializePeer() {
    if (typeof Peer === "undefined") {
        statusElement.textContent = "PeerJS library failed to load.";
        return;
    }

    peer = new Peer();

    peer.on("open", peerId => {
        peerReady = true;

        console.log("Sender PeerID:", peerId);

        generateQRCodes(peerId);

        statusElement.textContent =
            "PeerJS connected. Start sharing your display.";
    });

    // Register before screen sharing starts.
    peer.on("call", incomingCall => {
        console.log("Incoming call:", incomingCall.peer);
        answerCall(incomingCall);
    });

    peer.on("connection", handleConnection);

    peer.on("disconnected", () => {
        peerReady = false;
        statusElement.textContent = "PeerJS disconnected.";
    });

    peer.on("error", error => {
        console.error("PeerJS error:", error);
        statusElement.textContent = "PeerJS error: " + error.type;
    });
}

/* Desktop screen capture */
startButton.addEventListener("click", async () => {
    if (!peerReady) {
        statusElement.textContent = "PeerJS is not ready.";
        return;
    }

    if (localStream) return;

    try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: false
        });

        const videoTrack = localStream.getVideoTracks()[0];

        if (videoTrack) {
            videoTrack.addEventListener("ended", () => {
                localStream = null;
                startButton.disabled = false;
                startButton.textContent = "Start Sharing Display";
                statusElement.textContent = "Screen sharing stopped.";
            });
        }

        startButton.disabled = true;
        startButton.textContent = "Sharing Display";

        statusElement.textContent =
            "Screen sharing active. Waiting for mobile clients.";

        answerPendingCalls();

    } catch (error) {
        console.error("Screen sharing error:", error);
        statusElement.textContent =
            "Screen sharing failed: " + error.message;
    }
});

/* Start */
changeSize();
initializePeer();

</script>

</body>
</html>
