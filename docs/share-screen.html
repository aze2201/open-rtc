
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenRTC AR Viewer</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Original AR.js scene -->
    <a-scene
        id="myScene"
        vr-mode-ui="enabled: true;"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="trackingMethod: best; debugUIEnabled: false;">

        <a-box
            id="box"
            look-at="[gps-camera]"
            src="#their-video"
            position="0 1.6 -5"
            width="3"
            height="3"
            depth="2">
        </a-box>

    </a-scene>

    <!-- Remote desktop video used as AR object texture -->
    <div class="pure-u-2-3" id="video-container">
        <video
            id="their-video"
            width="2"
            height="2"
            autoplay
            muted
            playsinline>
        </video>
    </div>

<script>
"use strict";

/* --------------------------------------------------
   PeerJS configuration
-------------------------------------------------- */

const params = new URLSearchParams(window.location.search);
const remotePeerId = params.get("PeerDesktopID");

const theirVideo = document.getElementById("their-video");

let peer = null;
let mediaCall = null;
let dataConnection = null;
let bootstrapStream = null;

/* --------------------------------------------------
   AR object settings
-------------------------------------------------- */

function updateBoxAttributes(newWidth, newHeight, newDistance) {
    const boxElement = document.getElementById("box");

    if (!boxElement) return;

    boxElement.setAttribute("width", newWidth);
    boxElement.setAttribute("height", newHeight);

    boxElement.setAttribute(
        "position",
        "0 1.6 -" + newDistance
    );
}

/* --------------------------------------------------
   WebRTC bootstrap stream

   AR.js handles the actual camera.
   We do NOT request another camera stream here.

   The dummy stream only establishes the outgoing
   side of the PeerJS media call. The desktop sends
   its screen stream back through the same call.
-------------------------------------------------- */

function createBootstrapStream() {
    const canvas = document.createElement("canvas");

    canvas.width = 2;
    canvas.height = 2;

    const context = canvas.getContext("2d");

    context.fillStyle = "black";
    context.fillRect(0, 0, 2, 2);

    if (typeof canvas.captureStream !== "function") {
        throw new Error("Canvas captureStream is not supported.");
    }

    return canvas.captureStream(1);
}

/* --------------------------------------------------
   Receive desktop video
-------------------------------------------------- */

function handleRemoteStream(remoteStream) {
    console.log("Desktop screen stream received.");

    theirVideo.srcObject = remoteStream;

    theirVideo.play().catch(error => {
        console.warn("Video autoplay issue:", error);
    });
}

/* --------------------------------------------------
   Handle settings from desktop
-------------------------------------------------- */

function handleSettings(data) {
    console.log("Received desktop settings:", data);

    const parts = String(data).split(",");

    if (parts.length < 3) return;

    const width = parseFloat(parts[0]);
    const height = parseFloat(parts[1]);
    const distance = parseFloat(parts[2]);

    if (![width, height, distance].every(Number.isFinite)) {
        console.warn("Invalid settings received:", data);
        return;
    }

    updateBoxAttributes(width, height, distance);
}

/* --------------------------------------------------
   Cleanup
-------------------------------------------------- */

function cleanup() {
    if (mediaCall) {
        mediaCall.close();
        mediaCall = null;
    }

    if (dataConnection) {
        dataConnection.close();
        dataConnection = null;
    }

    if (bootstrapStream) {
        bootstrapStream.getTracks().forEach(track => track.stop());
        bootstrapStream = null;
    }

    if (peer && !peer.destroyed) {
        peer.destroy();
        peer = null;
    }
}

/* --------------------------------------------------
   Connect to desktop
-------------------------------------------------- */

function connectToDesktop() {

    if (!remotePeerId) {
        console.error("Missing PeerDesktopID in URL.");
        return;
    }

    console.log("Connecting to desktop:", remotePeerId);

    try {
        bootstrapStream = createBootstrapStream();

        peer = new Peer();

        peer.on("open", peerId => {

            console.log("Mobile Peer ID:", peerId);

            /*
             * One media call:
             * Mobile sends bootstrap track.
             * Desktop answers with screen stream.
             */
            mediaCall = peer.call(remotePeerId, bootstrapStream);

            if (!mediaCall) {
                console.error("Could not create PeerJS media call.");
                return;
            }

            mediaCall.on("stream", handleRemoteStream);

            mediaCall.on("close", () => {
                console.log("Desktop media connection closed.");
            });

            mediaCall.on("error", error => {
                console.error("Media call error:", error);
            });

            /*
             * Separate data connection for AR settings.
             */
            dataConnection = peer.connect(remotePeerId);

            dataConnection.on("open", () => {
                console.log("Desktop settings connection opened.");

                dataConnection.send(
                    "I am connected to you from the AR viewer."
                );
            });

            dataConnection.on("data", handleSettings);

            dataConnection.on("error", error => {
                console.error("Data connection error:", error);
            });
        });

        peer.on("error", error => {
            console.error("PeerJS error:", error);
        });

        peer.on("disconnected", () => {
            console.warn("PeerJS disconnected.");
        });

    } catch (error) {
        console.error("Connection initialization failed:", error);
    }
}

/* --------------------------------------------------
   Start
-------------------------------------------------- */

connectToDesktop();

window.addEventListener("pagehide", cleanup);

</script>

</body>
</html>
